<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — Мультимедийная галерея</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="container">
    <h1 class="hero-title" style="font-size:48px;margin-bottom:8px;">Админ-панель.</h1>
    <p class="subtitle">Пользователи и все материалы.</p>

    <div class="notice" id="notice"></div>

    <h2 class="panel-title" style="margin-top:48px;">Пользователи</h2>
    <div class="panel admin-table" id="users-box"><div class="empty-state">Загрузка…</div></div>

    <h2 class="panel-title" style="margin-top:56px;">Все материалы</h2>
    <div class="filter-bar" style="margin-bottom:24px;justify-content:flex-start;">
      <button class="filter active" data-admin-type="">Все</button>
      <button class="filter" data-admin-type="image">Изображения</button>
      <button class="filter" data-admin-type="video">Видео</button>
      <button class="filter" data-admin-type="audio">Аудио</button>
      <input class="search-input" type="text" id="admin-search" placeholder="Поиск по названию" autocomplete="off">
    </div>
    <div class="panel admin-table table-scroll" id="materials-box"><div class="empty-state">Загрузка…</div></div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/js/api.js"></script>
  <script>
    MG.init({
      requireAuth: true,
      onReady: async () => {
        if (!MG.auth.isAdmin()) {
          MG.showNotice('#notice', 'Доступ только для администратора', 'error');
          MG.qs('#users-box').innerHTML = '';
          MG.qs('#materials-box').innerHTML = '';
          return;
        }

        let adminType = '';
        let adminQ = '';
        let adminTimer = null;

        MG.qsa('[data-admin-type]').forEach(btn => {
          btn.addEventListener('click', () => {
            MG.qsa('[data-admin-type]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            adminType = btn.getAttribute('data-admin-type');
            loadMaterials();
          });
        });
        MG.qs('#admin-search').addEventListener('input', (ev) => {
          adminQ = ev.target.value.trim();
          clearTimeout(adminTimer);
          adminTimer = setTimeout(loadMaterials, 350);
        });

        await loadUsers();
        await loadMaterials();

        async function loadUsers() {
          try {
            const users = await MG.api.adminUsers();
            MG.qs('#users-box').innerHTML = users.length ? `
              <div class="table-scroll"><table>
                <tr><th>#</th><th>Логин</th><th>E-mail</th><th>Роль</th><th>Материалов</th><th>Регистрация</th></tr>
                ${users.map(u => `
                  <tr>
                    <td>${u.id}</td>
                    <td>${MG.escapeHtml(u.login)}</td>
                    <td>${MG.escapeHtml(u.email)}</td>
                    <td>${u.role === 'admin' ? '<span class="badge badge-admin">Админ</span>' : '<span class="badge">Пользователь</span>'}</td>
                    <td>${u.materials_count ?? 0}</td>
                    <td>${MG.formatDate(u.created_at)}</td>
                  </tr>`).join('')}
              </table></div>` : '<div class="empty-state">Пользователей нет</div>';
          } catch (e) { MG.showNotice('#notice', e.message, 'error'); }
        }

        async function loadMaterials() {
          try {
            const items = await MG.api.adminMaterials({
              type: adminType || undefined,
              q: adminQ || undefined,
            });
            const box = MG.qs('#materials-box');
            box.innerHTML = items.length ? `
              <table>
                <tr><th>#</th><th>Название</th><th>Тип</th><th>Категория</th><th>Автор</th><th>Дата</th><th></th></tr>
                ${items.map(m => `
                  <tr>
                    <td>${m.id}</td>
                    <td><a href="/material.html?id=${m.id}">${MG.escapeHtml(m.title)}</a></td>
                    <td>${MG.typeLabel(m.type)}</td>
                    <td>${MG.escapeHtml(m.category)}</td>
                    <td>${MG.escapeHtml(m.author)}</td>
                    <td>${MG.formatDate(m.created_at)}</td>
                    <td><button class="btn btn-link" style="color:var(--danger);" data-del="${m.id}">Удалить</button></td>
                  </tr>`).join('')}
              </table>` : '<div class="empty-state">Материалов не найдено.</div>';
            MG.qsa('[data-del]').forEach(b => b.addEventListener('click', async () => {
              const id = b.getAttribute('data-del');
              const ok = await MG.confirmDialog('Удалить материал без возможности восстановления?');
              if (!ok) return;
              try {
                await MG.api.adminDeleteMaterial(id);
                MG.toast('Материал удалён', 'success');
                await loadMaterials();
              } catch (e) { MG.toast(e.message, 'error'); }
            }));
          } catch (e) { MG.showNotice('#notice', e.message, 'error'); }
        }
      }
    });
  </script>
</body>
</html>
