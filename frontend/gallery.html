<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея — Мультимедийная галерея</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="container-wide">
    <h1 class="section-title">Галерея.</h1>

    <div class="filter-bar">
      <button class="filter" data-type="">Все</button>
      <button class="filter" data-type="image">Изображения</button>
      <button class="filter" data-type="video">Видео</button>
      <button class="filter" data-type="audio">Аудио</button>
      <select class="filter-select" id="category" aria-label="Категория">
        <option value="">Все категории</option>
      </select>
      <input class="search-input" type="text" id="search" placeholder="Поиск по названию" autocomplete="off">
    </div>

    <div class="notice" id="notice"></div>
    <div id="list">
      <div class="empty-state">Загрузка…</div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/js/api.js"></script>
  <script>
    MG.init({
      onReady: async () => {
        let currentType = MG.getParam('type') || '';
        let currentCategory = MG.getParam('category') || '';
        let currentQ = MG.getParam('q') || '';
        let searchTimer = null;

        // Пилюли фильтра по типу
        MG.qsa('.filter').forEach(btn => {
          if (btn.getAttribute('data-type') === currentType) btn.classList.add('active');
          btn.addEventListener('click', () => {
            MG.qsa('.filter').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentType = btn.getAttribute('data-type');
            syncUrl();
            load();
          });
        });

        // Селект категорий — загружаем список и ставим текущее значение
        try {
          const cats = await MG.api.categories();
          const sel = MG.qs('#category');
          sel.innerHTML = '<option value="">Все категории</option>' +
            cats.map(c => `<option value="${c.id}">${MG.escapeHtml(c.name)}</option>`).join('');
          if (currentCategory) sel.value = currentCategory;
          sel.addEventListener('change', () => {
            currentCategory = sel.value;
            syncUrl();
            load();
          });
        } catch (e) { /* молча — фильтр просто не появится */ }

        // Поиск: отправляем на сервер с задержкой 350 мс
        const search = MG.qs('#search');
        search.value = currentQ;
        search.addEventListener('input', (ev) => {
          currentQ = ev.target.value.trim();
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => { syncUrl(); load(); }, 350);
        });

        function syncUrl() {
          const url = new URL(window.location.href);
          const set = (k, v) => v ? url.searchParams.set(k, v) : url.searchParams.delete(k);
          set('type', currentType);
          set('category', currentCategory);
          set('q', currentQ);
          history.replaceState({}, '', url);
        }

        async function load() {
          MG.qs('#list').innerHTML = '<div class="empty-state">Загрузка…</div>';
          try {
            const items = await MG.api.materials({
              type: currentType || undefined,
              category: currentCategory || undefined,
              q: currentQ || undefined,
            });
            renderList(items);
          } catch (e) {
            MG.showNotice('#notice', e.message || 'Не удалось загрузить', 'error');
          }
        }

        function renderList(items) {
          const box = MG.qs('#list');
          if (!items.length) {
            const hint = currentQ
              ? `По запросу «${MG.escapeHtml(currentQ)}» ничего не найдено.`
              : 'Материалов не найдено.';
            box.innerHTML = `<div class="empty-state">${hint}</div>`;
            return;
          }
          box.innerHTML = '<div class="cards">' + items.map(m => `
            <article class="card">
              <a href="/material.html?id=${m.id}">
                <div class="card-preview">
                  ${m.type === 'image'
                    ? `<img src="${MG.escapeHtml(m.file_path)}" alt="${MG.escapeHtml(m.title)}" loading="lazy">`
                    : MG.typeIcon(m.type)}
                </div>
                <div class="card-body">
                  <div class="card-title">${MG.escapeHtml(m.title)}</div>
                  <div class="card-meta">
                    <span class="cat">${MG.escapeHtml(m.category)}</span>
                    ${MG.typeLabel(m.type)} · ${MG.escapeHtml(m.author)}
                  </div>
                </div>
              </a>
            </article>
          `).join('') + '</div>';
        }

        await load();
      }
    });
  </script>
</body>
</html>
